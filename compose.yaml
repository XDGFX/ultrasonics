# An example ultrasonics install. `docker compose up -d` builds and starts it; the UI is then on
# http://<this machine>:5000. Upgrading is `docker compose build --pull && docker compose up -d`:
# migrations run at boot, after a copy of the database is kept beside it.
services:
  ultrasonics:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    # Each plugin runs in its own worker, but Bun can't cap a worker's heap, so this limit is what
    # stops one plugin taking the host's memory. At it, the container restarts and the cut-short run
    # shows as interrupted.
    mem_limit: 1g
    ports:
      - "5000:5000"
    volumes:
      # The database (ultrasonics-v2.db), its key file and plugin data. Back this directory up.
      # Upgrading from v1 keeps v1's directory here: v2 reads v1's ultrasonics.db and never changes it.
      - ./config:/config
      # The local playlists and local music database plugins see only what is mounted here. Mount
      # your music and playlist folders, then use these container paths in the plugins' settings.
      # - /path/to/music:/music
      # - /path/to/playlists:/playlists
    environment:
      # Encrypts your service credentials at rest. `auto` keeps a generated key in
      # ./config/ultrasonics.key, so a backup of ./config carries it. To keep the key apart from
      # the data instead, set 64 hex characters (`openssl rand -hex 32`) and store them safely:
      # without the key, saved connections cannot be read.
      ENCRYPTION_KEY: auto
      # Who may use the app. `bootstrapped`: no login; whoever reaches port 5000 is the owner,
      # so keep it on a network you trust. `proxy`: a reverse proxy in front (Authelia,
      # Authentik) logs people in. Port 5000 must then be unreachable except through the proxy,
      # which compose.proxy.yaml sets up.
      AUTH_SOURCE: bootstrapped
